<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/ICON/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/ICON/icon-180.png?v=20261019-1">
    <meta name="description" content="cf-imghub - A modern image hosting platform">
    <meta name="keywords" content="cf-imghub, image hosting, cloud storage">
    <title>cf-imghub</title>
    <script>
      if ((location.pathname.replace(/\/$/, "") || "/") === "/") {
        ["/js/chunk-vendors.6243340b.js", "/js/app.aaa68371.js?v=20261031-nonblocking-config-v2", "/js/923.20261031.js"].forEach((url) => {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "script";
          preload.href = url;
          document.head.appendChild(preload);
        });
      }
    </script>
    <style>
      html, body { background:#17191a!important; color:#f2f4f7; }
      #app > .boot-loading {
        box-sizing:border-box;
        display:grid;
        min-height:100vh;
        place-content:center;
        justify-items:center;
        gap:14px;
        color:#f2f4f7;
        font:500 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
      }
      .boot-loading p { margin:0; }
      .boot-loading-spinner {
        width:28px;
        height:28px;
        border:3px solid rgba(255,255,255,.2);
        border-top-color:#48a978;
        border-radius:50%;
        animation:boot-spin .8s linear infinite;
      }
      @keyframes boot-spin { to { transform:rotate(360deg); } }
    </style>
    <link href="/css/chunk-vendors.f9cd4701.css" rel="stylesheet">
    <link href="/css/app.a5d6bf3c.css" rel="stylesheet">
    <link href="/ui-enhancements.css?v=20261021-channel-grid-v44" rel="stylesheet">
    <link href="/admin-control.css?v=20261031-login-language-viewport-v1" rel="stylesheet">
    <script>
      const savedLocale = localStorage.getItem("app-locale");
      if (savedLocale === "en" || savedLocale === "zh-CN") document.documentElement.lang = savedLocale;
    </script>
    <script>
      if (location.pathname.startsWith("/admin")) document.documentElement.classList.add("admin-route");
      if (location.hash === "#File") document.documentElement.classList.add("admin-file-route");
      if (location.pathname.startsWith("/admin") && matchMedia("(max-width:900px)").matches) {
        document.documentElement.classList.add("mobile-viewport");
        addEventListener("load", () => document.documentElement.classList.add("app-ready"));
      }
    </script>
    <script src="/ui-enhancements.js?v=20261027-channel-availability-v1"></script>
    <script>
      const path = location.pathname.replace(/\/$/, "") || "/";
      const loadScript = (url) => new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${url}`));
        document.head.appendChild(script);
      });
      const loadApplication = () => loadScript("/js/chunk-vendors.6243340b.js")
        .then(() => loadScript("/js/app.aaa68371.js?v=20261031-nonblocking-config-v2"));
      const showLoadError = () => {
        document.getElementById("app").innerHTML =
          '<main class="standalone-not-found"><section><h1>页面加载失败</h1><p>请检查网络连接后刷新页面。</p><button type="button" onclick="location.reload()">重新加载</button></section></main>';
      };

      if (path === "/") {
        loadApplication().catch(showLoadError);
      } else {
        fetch("/api/siteConfig", { credentials: "include", cache: "no-store" })
          .then((response) => response.ok ? response.json() : Promise.reject(new Error("Unable to load site settings")))
          .then((config) => {
            const adminPath = config.adminPath || "/admin";
            const known = ["/login", "/customerConfig", "/blockimg", "/whiteliston", "/browse", adminPath]
              .includes(path) || path.startsWith("/browse/");
            if (!location.pathname.split("/").pop().includes(".") && !known) {
              document.getElementById("app").innerHTML =
                '<main class="standalone-not-found"><section><h1>页面不存在</h1><p>Page not found</p><a href="/">返回主页 · Home</a></section></main>';
              return null;
            }
            if (path === adminPath) {
              return loadScript("/admin-app.js?v=20261031-login-language-viewport-v1");
            }
            return loadApplication();
          })
          .catch(showLoadError);
      }
    </script>
  </head>
  <body>
    <noscript>请启用 JavaScript 以使用 cf-imghub。</noscript>
    <div id="app">
      <main class="boot-loading" role="status" aria-live="polite">
        <span class="boot-loading-spinner" aria-hidden="true"></span>
        <p>正在加载页面…</p>
      </main>
    </div>
    <script>
      if (location.pathname === "/admin" && location.hash !== "#File" && location.hash !== "#JSON") {
        document.getElementById("app").innerHTML =
          '<main class="standalone-initializing" role="status" aria-live="polite"><span class="standalone-initializing-spinner" aria-hidden="true"></span><p>正在初始化管理面板…</p></main>';
      }
    </script>
  </body>
</html>
