# Cloudflare Workers 部署配置
# 使用方式: npx wrangler deploy --config deploy/worker/wrangler.toml
#
# 部署前需要配置：
# 1. 元数据数据库：D1 或 KV 至少配置一个，用于保存 CONFIG、图片路径和元数据。
#    同时配置时，应用会按数据库选择逻辑使用其中一个。
# 2. 图片存储渠道：至少配置一个，例如 R2、Telegram、S3、Discord、Hugging Face 或 WebDAV。
#    只有选择 R2 作为图片渠道时才需要绑定 R2；它与 D1/KV 用途不同。
# 3. 在 [vars] 或 Cloudflare Secrets 中配置所选图片渠道需要的凭据。
#
# GitHub Actions 部署时会自动从 Secrets/Variables 生成此文件，
# 无需手动编辑。详见 .github/workflows/deploy-worker.yml

name = "cf-imghub"
main = "index.js"
compatibility_date = "2024-08-21"
# 让 Worker 对自身 zone 的 fetch() 走公网入口，不要直连 origin。
compatibility_flags = ["global_fetch_strictly_public"]

# 静态资源（前端文件）
[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
